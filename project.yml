name: CarTubeBrowser
options:
  bundleIdPrefix: com.cartube
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: CarTubeBrowser
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: CarTubeBrowser/App/Info.plist
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CarTubeBrowser:
    type: application
    platform: iOS
    sources:
      - path: CarTubeBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cartube.aptv.browser
        INFOPLIST_FILE: CarTubeBrowser/App/Info.plist
    dependencies:
      - sdk: CarPlay.framework
      - sdk: WebKit.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
